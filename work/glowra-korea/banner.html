<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>GLOWRA 한국 런칭 배너 1200×628 (컨셉)</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#ddd}
  .b{width:1200px;height:628px;position:relative;overflow:hidden;background:#EEF5F0;font-family:"Pretendard Variable",Pretendard,sans-serif;color:#17201C;word-break:keep-all;-webkit-font-smoothing:antialiased}
  .img{position:absolute;right:0;top:0;width:560px;height:628px;background:url(img/bottle.jpg) 70% 60%/cover}
  .img:before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,#EEF5F0 0%,rgba(238,245,240,0) 26%)}
  .copy{position:absolute;left:72px;top:0;bottom:0;width:640px;display:flex;flex-direction:column;justify-content:center}
  .brand{font-family:Fraunces,serif;font-size:22px;letter-spacing:.28em;color:#1D3A2F;margin-bottom:26px}
  .chip{align-self:flex-start;display:inline-flex;align-items:center;gap:10px;background:#1D3A2F;color:#fff;font-size:20px;font-weight:700;border-radius:999px;padding:10px 20px;margin-bottom:24px}
  .chip i{width:8px;height:8px;border-radius:50%;background:#FF8F6E}
  h1{font-size:62px;line-height:1.22;font-weight:800;letter-spacing:-.045em}
  h1 em{font-style:normal;color:#1D3A2F;background:linear-gradient(transparent 62%,#CFE5D7 62%)}
  .sub{margin-top:18px;font-size:23px;color:#5E6A64;font-weight:500;letter-spacing:-.02em}
  .row{display:flex;align-items:center;gap:18px;margin-top:34px}
  .cta{background:#F0643E;color:#fff;font-size:22px;font-weight:800;border-radius:16px;padding:18px 30px;letter-spacing:-.02em}
  .meta{font-size:18px;color:#5E6A64;font-weight:600}
  .seal{position:absolute;left:742px;top:58px;width:150px;height:150px;border-radius:50%;background:#F0643E;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;transform:rotate(-8deg);box-shadow:0 14px 30px -12px rgba(240,100,62,.7)}
  .seal small{font-size:16px;font-weight:700}
  .seal strong{font-size:50px;font-weight:900;letter-spacing:-.04em;line-height:1.02}
</style>
</head>
<body>
<div class="b">
  <div class="img"></div>
  <div class="copy">
    <div class="brand">GLOWRA</div>
    <span class="chip"><i></i>호주 클린 스킨케어, 한국 첫 런칭</span>
    <h1>속당김 없는 물광 세럼<br><em>지금 1+1</em>로 만나보세요</h1>
    <p class="sub">배리어 듀 세럼 30ml · 세라마이드 + 카카두플럼</p>
    <div class="row"><span class="cta">런칭 혜택 받기 →</span><span class="meta">2주 한정 · 무료배송</span></div>
  </div>
  <div class="seal"><small>런칭 기념</small><strong>1+1</strong></div>
</div>
</body>
</html>
